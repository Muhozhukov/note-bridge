name: Build experimental release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
concurrency:
  group: experimental-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish experimental assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$VERSION" dist/note-bridge/main.js dist/note-bridge/manifest.json dist/note-bridge/styles.css --target "$GITHUB_SHA" --prerelease --title "Note Bridge $VERSION — experimental" --notes-file docs/STATUS.md
